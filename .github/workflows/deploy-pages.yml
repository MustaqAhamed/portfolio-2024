name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install -g @angular/cli      - name: Build
        run: |
          npm run build:gh-pages
          cd dist/portfolio-delta/browser
          cp index.html 404.html
          touch .nojekyll
          echo "Verifying build output:"
          ls -la

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist/portfolio-delta/browser
          clean: true
          clean-exclude: |
            .nojekyll
