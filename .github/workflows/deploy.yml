name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install -g @angular/cli      - name: Build
        run: |
          npm run build -- --configuration production --base-href="/portfolio-2024/"
          cd dist/portfolio-delta/browser/browser
          cp index.html 404.html
          touch .nojekyll
          echo "Build output contents:"
          ls -la
          cd ../..
          mv browser/browser/* browser/
          rm -rf browser/browser

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/portfolio-delta/browser
          branch: gh-pages
          clean: true
          single-commit: true
